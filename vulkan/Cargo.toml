[package]
name = "yufmusicgen-vulkan"
version = "0.1.0"
edition = "2021"
description = "Vulkan-based YufMusicGen client: RWKV-7/ROSA MIDI generation on Vulkan compute, with a native piano-roll viewer"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
ash = "0.38"
ash-window = "0.13"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
clap = { version = "4", features = ["derive"] }
winit = "0.30"
raw-window-handle = "0.6"

[build-dependencies]
naga = { version = "0.20", features = ["glsl-in", "spv-out"] }

[dev-dependencies]
rspirv = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
